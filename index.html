<!doctype html>
<!-- Chess 3D entry page -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07080c">
<!-- iOS Home Screen: full screen, dark status bar, short name. Desktop browsers ignore these. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chess 3D">
<meta name="format-detection" content="telephone=no">
<title>Chess 3D</title>
<meta name="description" content="A 3D chessboard for the browser: marble and walnut board, sculpted pieces, studio lighting. Play the computer or a friend.">
<link rel="canonical" href="https://bop-del.github.io/chess-3d/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Chess 3D">
<meta property="og:title" content="Chess 3D">
<meta property="og:description" content="A 3D chessboard for the browser: marble and walnut board, sculpted pieces, studio lighting.">
<meta property="og:url" content="https://bop-del.github.io/chess-3d/">
<meta property="og:image" content="https://bop-del.github.io/chess-3d/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A marble and walnut chessboard with sculpted pieces in studio light">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Chess 3D">
<meta name="twitter:description" content="A 3D chessboard for the browser: marble and walnut board, sculpted pieces, studio lighting.">
<meta name="twitter:image" content="https://bop-del.github.io/chess-3d/og-image.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='56' fill='%23d8b468'%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<canvas id="stage" aria-label="3D chessboard"></canvas>

<div id="loader" role="status" aria-live="polite">
  <div class="loader-card">
    <div class="loader-mark" aria-hidden="true">♞︎</div>
    <h1>Chess 3D</h1>
    <p class="loader-sub" data-i18n="loader.sub">Sculpting the board and pieces</p>
    <div class="loader-bar"><i id="loader-fill"></i></div>
    <p class="loader-step" id="loader-step">Starting</p>
    <p class="loader-err" id="loader-err" hidden></p>
  </div>
</div>

<div id="hud"></div>
<div id="banner" hidden></div>
<div id="promo" hidden></div>
<div id="toast" aria-live="polite"></div>
<div id="notice" role="alert" hidden onclick="location.reload()"></div>

<script>
  // if the game script never ran (a browser too old to parse it, a failed download), say so instead of loading forever
  setTimeout(function () {
    var l = document.getElementById('loader');
    if (!l || window.__chessBooted) return;
    var st = document.getElementById('loader-step'), er = document.getElementById('loader-err');
    if (st) st.textContent = 'Could not start';
    if (er) { er.hidden = false; er.textContent = 'Reload the page, or use a current browser with WebGL 2 (for example Chrome, Edge, Firefox or Safari 15 or later).'; }
  }, 20000);
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
