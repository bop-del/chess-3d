<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="A 3D chessboard for the browser: marble and walnut board, sculpted pieces, studio lighting. Play the computer or a friend.">
<link rel="canonical" href="https://chess3d.borisdiebold.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Chess 3D">
<meta property="og:title" content="Chess 3D">
<meta property="og:description" content="A 3D chessboard for the browser: marble and walnut board, sculpted pieces, studio lighting.">
<meta property="og:url" content="https://chess3d.borisdiebold.com/">
<meta property="og:image" content="https://chess3d.borisdiebold.com/og-image.png">
<meta property="og:image:width" content="1200">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='56' fill='%23d8b468'%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
<style>
/* CHE-345: the first frame. Only what the start picture needs, so it paints before style.css and the script have arrived. */
html,body{margin:0;background:#07080c}
#loader{position:fixed;inset:0;z-index:50;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#171922 0%,#07080c 72%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.start-pic{position:absolute;left:50%;top:50%;width:min(34vw,150px);height:min(60vw,270px);transform:translate(-50%,-56%);transition:opacity .35s ease}
.start-pic svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 14px rgba(216,180,104,.7))}
.start-pic path{fill:rgba(216,180,104,.82);stroke:#f3dfa8;stroke-width:1.6}
#loader.live .start-pic,html.direct .start-pic,#loader.fallback .start-pic{opacity:0}
</style>
<script>
  // test and state links (a position, a view, a panel ...) open straight in the target state: no start picture, no animation (main.js reads the same list)
  (function () {
    var q = new URLSearchParams(location.search), on = q.get('intro') === '1';
    if (on) return;
    var f = ['fen', 'moves', 'open', 'select', 'view', 'promo', 'line', 'preset', 'yaw', 'pitch', 'dist', 'gx', 'gy', 'gz', 'symbols', 'help', 'hud', 'spin', 'light', 'theme'];
    for (var i = 0; i < f.length; i++) if (q.has(f[i])) { document.documentElement.className += ' direct'; return; }
  })();
</script>
<link rel="stylesheet" href="./src/style.css">
</head>
<body class="intro">
<canvas id="stage" aria-label="3D chessboard"></canvas>
<div id="intro-dark" aria-hidden="true"></div>

<div id="loader" role="status" aria-live="polite">
  <div class="start-pic" aria-hidden="true"><svg viewBox="0 0 60 100" preserveAspectRatio="xMidYMax meet"><path d="M6 100V93H54V100ZM27 0H33V6H39V12H33V20C44 24 50 34 46 46C44 54 40 62 40 70C40 80 44 86 48 93H12C16 86 20 80 20 70C20 62 16 54 14 46C10 34 16 24 27 20V12H21V6H27Z"/></svg></div>
  <div id="loader-board" aria-hidden="true"></div>
  <h1 class="loader-title">Chess 3D</h1>
  <div class="loader-foot">
    <p class="loader-step" id="loader-step">Starting</p>
    <p class="loader-version" id="loader-version"></p>
    <p class="loader-err" id="loader-err" hidden></p>
  </div>
</div>

<div id="hud"></div>
<div id="banner" hidden></div>
<div id="promo" hidden></div>
<div id="toast" aria-live="polite"></div>
<div id="notice" role="alert" hidden onclick="location.reload()"></div>

<script>
  // if the game script never ran (a browser too old to parse it, a failed download), say so instead of loading forever
  setTimeout(function () {
    var l = document.getElementById('loader');
    if (!l || window.__chessBooted) return;
    var st = document.getElementById('loader-step'), er = document.getElementById('loader-err');
    if (st) st.textContent = 'Could not start';
    if (er) { er.hidden = false; er.textContent = 'Reload the page, or use a current browser with WebGL 2 (for example Chrome, Edge, Firefox or Safari 15 or later).'; }
  }, 20000);
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
